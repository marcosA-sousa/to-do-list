<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>📝 Gerenciador de Tarefas</h1>
            <p class="subtitle">Seja bem-vindo ao seu gerenciador de tarefas!</p>
        </header>

        <div class="main-content">
            <!-- Seção de Formulário -->
            <section class="form-section">
                <h2>Adicionar Nova Tarefa</h2>
                <form id="taskForm" class="task-form">
                    <div class="form-group">
                        <label for="taskTitle">Título *</label>
                        <input
                            type="text"
                            id="taskTitle"
                            placeholder="Digite o título da tarefa"
                            required
                            maxlength="255"
                        >
                    </div>

                    <div class="form-group">
                        <label for="taskDescription">Descrição</label>
                        <textarea
                            id="taskDescription"
                            placeholder="Digite a descrição (opcional)"
                            rows="3"
                            maxlength="1000"
                        ></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <span>➕ Adicionar Tarefa</span>
                    </button>
                </form>
            </section>

            <!-- Seção de Filtros -->
            <section class="filters-section">
                <h2>Filtros e Ordenação</h2>
                <div class="filters">
                    <div class="filter-group">
                        <label for="statusFilter">Status:</label>
                        <select id="statusFilter">
                            <option value="">Todas</option>
                            <option value="pending">Pendentes</option>
                            <option value="completed">Concluídas</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="sortBy">Ordenar por:</label>
                        <select id="sortBy">
                            <option value="created_at">Data de Criação</option>
                            <option value="title">Título</option>
                            <option value="status">Status</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="order">Ordem:</label>
                        <select id="order">
                            <option value="desc">Descendente</option>
                            <option value="asc">Ascendente</option>
                        </select>
                    </div>

                    <button id="refreshBtn" class="btn btn-secondary">
                        <span>🔄 Atualizar</span>
                    </button>
                </div>
            </section>

            <!-- Seção de Tarefas -->
            <section class="tasks-section">
                <h2>Suas Tarefas</h2>
                <div id="loadingIndicator" class="loading">
                    <p>Carregando tarefas...</p>
                </div>
                <div id="tasksList" class="tasks-list"></div>
                <div id="emptyState" class="empty-state" style="display: none;">
                    <p>📭 Nenhuma tarefa encontrada</p>
                </div>
            </section>
        </div>
    </div>

    <!-- Modal de Edição -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Editar Tarefa</h2>
            <form id="editForm" class="task-form">
                <input type="hidden" id="editTaskId">
                
                <div class="form-group">
                    <label for="editTaskTitle">Título *</label>
                    <input
                        type="text"
                        id="editTaskTitle"
                        required
                        maxlength="255"
                    >
                </div>

                <div class="form-group">
                    <label for="editTaskDescription">Descrição</label>
                    <textarea
                        id="editTaskDescription"
                        rows="3"
                        maxlength="1000"
                    ></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        💾 Salvar Alterações
                    </button>
                    <button type="button" class="btn btn-secondary" id="cancelEdit">
                        ❌ Cancelar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
